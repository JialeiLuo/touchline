name: Verify Touchline candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node tools/evaluate-comparative.cjs --split=all --out=/tmp/touchline-offline.json
      - run: python3 tools/build-release.py --verify --node "$(command -v node)"
